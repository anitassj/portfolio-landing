<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Demo del panel de Merkatu</title>
  <desc id="desc">Panel administrativo de un sistema de punto de venta con resumen de ventas, ingresos y actividad reciente.</desc>
  <rect width="1200" height="720" fill="#f2f5fa"/>
  <rect width="1200" height="72" fill="#fff"/>
  <rect x="28" y="20" width="34" height="34" rx="10" fill="#4f46e5"/>
  <path d="M37 30h16v16H37z" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="76" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#182235">merkatu</text>
  <text x="995" y="44" font-family="Arial,sans-serif" font-size="14" fill="#65728a">Comercio Demo</text>
  <circle cx="1150" cy="36" r="18" fill="#e5e9f2"/>
  <rect x="0" y="72" width="220" height="648" fill="#fff"/>
  <rect x="20" y="108" width="180" height="42" rx="9" fill="#eeedff"/>
  <text x="40" y="135" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4f46e5">Resumen</text>
  <text x="40" y="190" font-family="Arial,sans-serif" font-size="15" fill="#69768c">Productos</text>
  <text x="40" y="238" font-family="Arial,sans-serif" font-size="15" fill="#69768c">Ventas</text>
  <text x="40" y="286" font-family="Arial,sans-serif" font-size="15" fill="#69768c">Caja</text>
  <text x="40" y="334" font-family="Arial,sans-serif" font-size="15" fill="#69768c">Reportes</text>
  <text x="258" y="128" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#182235">Resumen del día</text>
  <text x="258" y="158" font-family="Arial,sans-serif" font-size="14" fill="#8290a5">Miércoles, 21 de octubre</text>
  <g font-family="Arial,sans-serif">
    <rect x="258" y="186" width="278" height="130" rx="12" fill="#fff"/>
    <text x="280" y="220" font-size="14" fill="#738098">Ventas de hoy</text>
    <text x="280" y="263" font-size="30" font-weight="700" fill="#182235">$ 248.500</text>
    <text x="280" y="292" font-size="13" fill="#16a477">↑ 12,8% vs. ayer</text>
    <rect x="554" y="186" width="278" height="130" rx="12" fill="#fff"/>
    <text x="576" y="220" font-size="14" fill="#738098">Órdenes</text>
    <text x="576" y="263" font-size="30" font-weight="700" fill="#182235">36</text>
    <text x="576" y="292" font-size="13" fill="#16a477">↑ 8 nuevas hoy</text>
    <rect x="850" y="186" width="300" height="130" rx="12" fill="#fff"/>
    <text x="872" y="220" font-size="14" fill="#738098">Productos con poco stock</text>
    <text x="872" y="263" font-size="30" font-weight="700" fill="#182235">4</text>
    <text x="872" y="292" font-size="13" fill="#e29a26">Revisar inventario</text>
  </g>
  <rect x="258" y="340" width="560" height="340" rx="12" fill="#fff"/>
  <text x="282" y="378" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182235">Ventas de la semana</text>
  <g stroke="#e9edf4" stroke-width="1">
    <path d="M300 430h476M300 490h476M300 550h476M300 610h476"/>
  </g>
  <path d="M312 590 380 540 448 557 516 480 584 503 652 435 720 462 770 410" fill="none" stroke="#5b54e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M312 590 380 540 448 557 516 480 584 503 652 435 720 462 770 410V630H312Z" fill="#5b54e8" opacity=".08"/>
  <g fill="#5b54e8">
    <circle cx="380" cy="540" r="5"/><circle cx="516" cy="480" r="5"/><circle cx="652" cy="435" r="5"/><circle cx="770" cy="410" r="5"/>
  </g>
  <rect x="838" y="340" width="312" height="340" rx="12" fill="#fff"/>
  <text x="862" y="378" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182235">Actividad reciente</text>
  <g font-family="Arial,sans-serif" font-size="13">
    <circle cx="876" cy="426" r="6" fill="#16a477"/><text x="895" y="423" fill="#344158">Venta #1042 completada</text><text x="895" y="444" fill="#9aa5b5">Hace 5 minutos</text>
    <circle cx="876" cy="490" r="6" fill="#5b54e8"/><text x="895" y="487" fill="#344158">Stock actualizado</text><text x="895" y="508" fill="#9aa5b5">Hace 18 minutos</text>
    <circle cx="876" cy="554" r="6" fill="#e29a26"/><text x="895" y="551" fill="#344158">Caja abierta</text><text x="895" y="572" fill="#9aa5b5">Hace 1 hora</text>
  </g>
</svg>
